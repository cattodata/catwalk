name: Deploy to Azure App Service (cattocompass)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC azure/login
  contents: read

env:
  RG: personal-ai-rg
  APP: cattocompass
  STORAGE: cattocompassdeploy
  CONTAINER: deploy
  BLOB: cattocompass.zip

jobs:
  build-and-deploy:
    name: Build + deploy via Run From Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build SPA
        run: npm run build

      - name: Prune dev dependencies for runtime
        run: npm prune --omit=dev --legacy-peer-deps || true

      - name: Zip artifact
        run: |
          zip -rq cattocompass.zip server dist node_modules package.json -x "*.DS_Store"
          ls -lh cattocompass.zip

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload zip to Azure Storage
        run: |
          CONN=$(az storage account show-connection-string -g $RG -n $STORAGE --query connectionString -o tsv)
          az storage blob upload \
            --connection-string "$CONN" \
            --container-name $CONTAINER \
            --name $BLOB \
            --file cattocompass.zip \
            --overwrite

      - name: Generate fresh SAS URL + update WEBSITE_RUN_FROM_PACKAGE
        run: |
          CONN=$(az storage account show-connection-string -g $RG -n $STORAGE --query connectionString -o tsv)
          EXPIRY=$(date -u -d "+1 year" +"%Y-%m-%dT%H:%MZ")
          SAS_URL=$(az storage blob generate-sas \
            --connection-string "$CONN" \
            --container-name $CONTAINER --name $BLOB \
            --permissions r --expiry "$EXPIRY" \
            --full-uri --output tsv)
          az webapp config appsettings set -g $RG -n $APP \
            --settings WEBSITE_RUN_FROM_PACKAGE="$SAS_URL" --output none

      - name: Restart App Service to pick up new package
        run: az webapp restart -g $RG -n $APP

      - name: Wait + smoke-test live URL
        run: |
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 https://$APP.azurewebsites.net/api/health || echo "000")
            echo "[$i/20] HTTP $code"
            if [ "$code" = "200" ]; then
              echo "[ready]"
              curl -sS https://$APP.azurewebsites.net/api/health
              exit 0
            fi
            sleep 20
          done
          echo "::warning::App did not become healthy in 6m40s"
          exit 1
