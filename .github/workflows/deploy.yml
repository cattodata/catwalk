name: Deploy to Azure App Service (cattocompass)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC azure/login
  contents: read

jobs:
  build-and-deploy:
    name: Build + deploy to cattocompass.azurewebsites.net
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build SPA
        run: npm run build

      - name: Prune dev dependencies for runtime
        run: npm prune --omit=dev --legacy-peer-deps || true

      - name: Zip artifact
        run: |
          zip -rq cattocompass.zip server dist node_modules package.json -x "*.DS_Store"
          ls -lh cattocompass.zip

      - name: Azure login (OIDC, no secrets stored)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy zip to Azure App Service
        run: |
          az webapp deploy \
            --resource-group personal-ai-rg \
            --name cattocompass \
            --src-path cattocompass.zip \
            --type zip \
            --async false
